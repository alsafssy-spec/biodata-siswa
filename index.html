<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"> 
<title>Jaringan - Biodata Guru dan Siswa</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;padding:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:#eef2f7;color:#14213d;line-height:1.5}
.wadah{max-width:480px;margin:0 auto;padding:18px 14px 40px}
header h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.5px;color:#0f172a}
header p{margin:4px 0 14px;color:#64748b}
.btn-tambah{background:#0f3d9e;color:#fff;border:none;border-radius:14px;padding:13px 18px;font-weight:700;font-size:15px;cursor:pointer;margin-bottom:6px}
.kontrol{display:flex;flex-direction:column;gap:10px;margin:14px 0 8px}
.kontrol input,.kontrol select{width:100%;font:inherit;color:#14213d;background:#fff;border:1px solid #cbd5e1;border-radius:14px;padding:14px 16px;font-size:15px}
.kontrol input:focus,.kontrol select:focus{outline:none;border-color:#0f3d9e;box-shadow:0 0 0 3px #0f3d9e22}
.jumlah{color:#64748b;font-size:13px;margin:0 0 16px}
.daftar{display:grid;gap:14px}
.kartu{background:#fff;border:1px solid #e2e8f0;border-radius:18px;overflow:hidden;box-shadow:0 4px 20px #0000000d}
.pita{height:62px;background:#0f3d9e}
.isi{padding:0 16px 16px;text-align:center}
.foto{width:84px;height:84px;margin:-42px auto 10px;border-radius:50%;border:4px solid #fff;background:#ffedd5;color:#c2410c;display:grid;place-items:center;font-weight:800;font-size:1.5rem;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover}
.nama{margin:0;font-size:18px;font-weight:800}.nis{margin:2px 0 8px;color:#64748b;font-size:13px}
.role{display:inline-block;background:#dbeafe;color:#0f3d9e;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:8px}
.rincian{margin:0;text-align:left;font-size:14px}
.rincian div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #e2e8f0}
.rincian dt{color:#64748b}.rincian dd{margin:0;font-weight:600;text-align:right}
.pesan{grid-column:1/-1;text-align:center;padding:40px 16px;color:#64748b}.pesan.galat{color:#b42318}
</style>
</head>
<body>
<div class="wadah">
  <header>
    <h1>Teknik komputer Jaringan</h1>
    <p>Cari berdasarkan role</p>
  </header>
  <button class="btn-tambah">+ Tambah Data</button>
  <div class="kontrol">
    <input id="cari" type="search" placeholder="Cari nama, NIS, atau NIP" aria-label="Cari nama atau NIS">
    <select id="filterRole" aria-label="Filter role"><option value="">Semua (Guru / Siswa)</option><option value="guru">Guru</option><option value="siswa">Siswa</option></select>
    <select id="filterKelas" aria-label="Filter kelas"><option value="">Semua Kelas / Mapel</option></select>
  </div>
  <p id="jumlah" class="jumlah" aria-live="polite"></p>
  <main id="daftar" class="daftar"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// --- KONFIGURASI SUPABASE KAMU YANG BARU ---
const SUPABASE_URL = "https://jwpzywmbzfsulqwjfvlk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3cHp5d21iemZzdWxxd2pmdmxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMjg4MjUsImV4cCI6MjEwODkwNDgyNX0.nwkU8wtrnCsJeHPLIhuxZ66Y8lxuenhTyFzUE_7rKVw";

const TAMPILKAN = { jenisKelamin: true, tanggalLahir: true, alamat: true, foto_url: true };
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const elDaftar = document.getElementById("daftar"), elJumlah = document.getElementById("jumlah"), elCari = document.getElementById("cari"), elKelas = document.getElementById("filterKelas"), elRole = document.getElementById("filterRole");
let semuaSiswa = [];

async function muatData() {
  tampilkanPesan("Memuat data...");
  const { data, error } = await db.from("siswa").select("*").order("nama");
  if (error) { console.error(error); tampilkanPesan("Data tidak bisa dimuat. Cek RLS Supabase.", true); return; }
  semuaSiswa = data; isiPilihanKelas(); tampilkanSiswa();
}
function tampilkanSiswa() {
  const kataKunci = elCari.value.trim().toLowerCase();
  const kelasDipilih = elKelas.value;
  const roleDipilih = elRole.value.toLowerCase();
  const hasil = semuaSiswa.filter((s) => {
    const roleData = String(s.role || (s.kelas && s.kelas.toLowerCase().includes('guru') ? 'guru' : 'siswa')).toLowerCase();
    const cocokKelas = !kelasDipilih || s.kelas === kelasDipilih || s.mapel === kelasDipilih;
    const cocokRole = !roleDipilih || roleData === roleDipilih;
    const cocokCari = !kataKunci || s.nama.toLowerCase().includes(kataKunci) || (s.nis && String(s.nis).toLowerCase().includes(kataKunci)) || (s.nip && String(s.nip).toLowerCase().includes(kataKunci));
    return cocokKelas && cocokRole && cocokCari;
  });
  elJumlah.textContent = hasil.length + " dari " + semuaSiswa.length + " data";
  elDaftar.replaceChildren();
  if (hasil.length === 0) { tampilkanPesan("Tidak ada data yang cocok."); return; }
  hasil.forEach((s) => elDaftar.appendChild(buatKartu(s)));
}
function buatKartu(s) {
  const kartu = el("article", "kartu"); kartu.appendChild(el("div", "pita"));
  const isi = el("div", "isi");
  const foto = el("div", "foto");
  if (s.foto_url) { const g=document.createElement("img"); g.src=s.foto_url; g.alt="Foto "+s.nama; g.loading="lazy"; g.onerror=()=>foto.replaceChildren(document.createTextNode(inisial(s.nama))); foto.appendChild(g); } else { foto.textContent=inisial(s.nama); }
  isi.appendChild(foto);
  const roleData = s.role || (s.kelas && s.kelas.toLowerCase().includes('guru') ? 'Guru' : 'Siswa');
  isi.appendChild(el("span","role",roleData.toUpperCase()));
  isi.appendChild(el("h2","nama",s.nama));
  const idLabel = String(roleData).toLowerCase()==='guru' ? 'NIP ' : 'NIS ';
  isi.appendChild(el("p","nis", idLabel + (s.nis || s.nip || '-')));
  const rincian = el("dl","rincian");
  tambahBaris(rincian, String(roleData).toLowerCase()==='guru' ? "Status" : "Kelas", s.kelas);
  if(s.mapel) tambahBaris(rincian, "Mata Pelajaran", s.mapel);
  if(TAMPILKAN.jenisKelamin) tambahBaris(rincian,"Jenis kelamin",s.jenis_kelamin);
  if(TAMPILKAN.tanggalLahir) tambahBaris(rincian,"Tanggal lahir",formatTanggal(s.tanggal_lahir));
  if(TAMPILKAN.alamat) tambahBaris(rincian,"Alamat",s.alamat);
  isi.appendChild(rincian); kartu.appendChild(isi); return kartu;
}
function el(tag,kelas,teks){const e=document.createElement(tag);if(kelas)e.className=kelas;if(teks)e.textContent=teks;return e}
function tambahBaris(dl,label,nilai){if(!nilai)return;const b=el("div");b.appendChild(el("dt","",label));b.appendChild(el("dd","",nilai));dl.appendChild(b)}
function inisial(nama){return nama.split(" ").filter(Boolean).slice(0,2).map(k=>k[0].toUpperCase()).join("")}
function formatTanggal(t){if(!t)return "";return new Date(t+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})}
function tampilkanPesan(teks,galat){elDaftar.replaceChildren(el("p","pesan"+(galat?" galat":""),teks))}
function isiPilihanKelas(){
  const list=[...new Set(semuaSiswa.map(s=>s.kelas||s.mapel).filter(Boolean))].sort();
  list.forEach(k=>{const o=el("option","",k);o.value=k;elKelas.appendChild(o)})
}
elCari.addEventListener("input",tampilkanSiswa);elKelas.addEventListener("change",tampilkanSiswa);elRole.addEventListener("change",tampilkanSiswa);
muatData();
</script>
</body>
</html>
