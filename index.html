<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"> 
<title>Teknik Komputer Jaringan</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--kartu:#fff;--teks:#14213d;--teks-redup:#5b667a;--garis:#d6dde8;--aksen:#f97316}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--teks);font-family:"Plus Jakarta Sans",sans-serif}
.wadah{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
header h1{margin:0;font-size:2.2rem;font-weight:800;line-height:1.1}
header p{margin:4px 0 0;color:var(--teks-redup)}
.btn-tambah{background:var(--aksen);color:#fff;border:none;border-radius:14px;padding:12px 18px;font-weight:700;margin:14px 0 6px;cursor:pointer}
.kontrol{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 8px}
.kontrol input,.kontrol select{font:inherit;color:var(--teks);background:var(--kartu);border:1px solid var(--garis);border-radius:12px;padding:12px 14px}
.kontrol input{flex:1 1 280px}.kontrol select{flex:1 1 180px}
.jumlah{color:var(--teks-redup);font-size:.9rem;margin:8px 0 16px}
.daftar{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.kartu{background:var(--kartu);border:1px solid #ffe4cc;border-radius:20px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.pita{height:82px;background:#f97316}
.isi{padding:0 16px 16px;text-align:center}
.foto{width:82px;height:82px;margin:-41px auto 8px;border-radius:50%;border:4px solid var(--kartu);background:#ffedd5;color:#c2410c;display:grid;place-items:center;font-weight:800;font-size:1.5rem;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover}
.nama{margin:0;font-size:1.1rem;font-weight:800}
.nis{margin:0 0 12px;color:var(--teks-redup);font-size:.85rem}
.rincian{margin:0;text-align:left;font-size:.9rem}
.rincian div{display:flex;justify-content:space-between;gap:12px;padding:12px 2px;border-top:1px solid var(--garis)}
.rincian dt{color:var(--teks-redup)}.rincian dd{margin:0;font-weight:700;text-align:right;max-width:65%}
.pesan{grid-column:1/-1;text-align:center;padding:40px 16px;color:var(--teks-redup)}
</style>
</head>
<body>
<div class="wadah">
<header><h1>Teknik Komputer<br>Jaringan</h1><p>Cari berdasarkan role</p></header>
<button class="btn-tambah">+ Tambah Data</button>
<div class="kontrol">
<input id="cari" type="search" placeholder="Cari nama, NIS, atau NIP">
<select id="filterRole"><option value="">Semua (Guru / Siswa)</option><option value="Guru">Guru</option><option value="Siswa">Siswa</option></select>
<select id="filterKelas"><option value="">Semua Kelas / Mapel</option></select>
</div>
<p id="jumlah" class="jumlah"></p>
<main id="daftar" class="daftar"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// === LINK SUPABASE KAMU YANG DI biodata-siswa-one.vercel.app ===
const SUPABASE_URL = "https://jwpzywmbzfsulqwjfvlk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3cHp5d21iemZzdWxxd2pmdmxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMjg4MjUsImV4cCI6MjEwODkwNDgyNX0.nwkU8wtrnCsJeHPLIhuxZ66Y8lxuenhTyFzUE_7rKVw";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const elDaftar=document.getElementById("daftar"), elJumlah=document.getElementById("jumlah"), elCari=document.getElementById("cari"), elKelas=document.getElementById("filterKelas"), elRole=document.getElementById("filterRole");
let semua=[];

async function muat(){
 const {data,error}=await db.from("siswa").select("*").order("nama");
 if(error){elDaftar.innerHTML="<p class='pesan'>"+error.message+"</p>";return}
 semua=data||[];
 const opsi=[...new Set(semua.map(s=>s.kelas||s.mapel||s.jurusan).filter(Boolean))].sort();
 opsi.forEach(k=>{let o=document.createElement("option");o.value=k;o.textContent=k;elKelas.appendChild(o)});
 tampil();
}
function tampil(){
 const q=elCari.value.toLowerCase(), r=elRole.value.toLowerCase(), k=elKelas.value;
 const hasil=semua.filter(s=>{
  const role=String(s.role||"Siswa").toLowerCase();
  return (!q||s.nama.toLowerCase().includes(q)||String(s.nis||"").includes(q)) && (!r||role===r) && (!k||s.kelas===k||s.mapel===k||s.jurusan===k);
 });
 elJumlah.textContent=hasil.length+" dari "+semua.length+" data";
 elDaftar.innerHTML="";
 hasil.forEach(s=>{
  const isGuru=String(s.role||"").toLowerCase()==="guru";
  const ini=s.nama.split(" ").filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join("");
  const foto=s.foto_url?`<img src="${s.foto_url}">`:ini;
  let baris=isGuru?`<div><dt>Jurusan</dt><dd>${s.jurusan||s.kelas||"Rekayasa Perangkat Lunak"}</dd></div><div><dt>Mapel</dt><dd>${s.mapel||"-"}</dd></div>`:`<div><dt>Kelas</dt><dd>${s.kelas||"-"}</dd></div><div><dt>Jenis kelamin</dt><dd>${s.jenis_kelamin||"-"}</dd></div><div><dt>Tanggal lahir</dt><dd>${s.tanggal_lahir?new Date(s.tanggal_lahir+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"}):"-"}</dd></div><div><dt>Alamat</dt><dd>${s.alamat||"-"}</dd></div>`;
  elDaftar.innerHTML+=`<article class="kartu"><div class="pita"></div><div class="isi"><div class="foto">${foto}</div><h2 class="nama">${s.nama}</h2><p class="nis">${isGuru?"NIP":"NIS"} ${s.nip||s.nis||"-"}</p><dl class="rincian">${baris}</dl></div></article>`;
 });
}
elCari.addEventListener("input",tampil); elKelas.addEventListener("change",tampil); elRole.addEventListener("change",tampil);
muat();
</script>
</body>
</html>
