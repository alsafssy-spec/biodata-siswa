<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biodata Oranye</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8fafc;font-family:Arial,sans-serif}
.wadah{max-width:480px;margin:auto;padding:12px}
.kartu{background:#fff;border-radius:22px;overflow:hidden;border:1px solid #fed7aa;box-shadow:0 4px 14px rgba(0,0,0,.06);margin-bottom:18px}
.header-kartu{height:90px;background:#f97316}
.isi{padding:0 18px 18px;text-align:center;margin-top:-45px}
.foto{width:90px;height:90px;margin:0 auto;border-radius:50%;border:4px solid #fff;background:#ffedd5;color:#c2410c;display:grid;place-items:center;font-size:24px;font-weight:800;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover}
.badge{margin-top:10px;display:inline-block;background:#ffedd5;color:#c2410c;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700}
.nama{font-size:19px;font-weight:800;margin:10px 0 2px;color:#0f172a}
.nis{color:#64748b;font-size:14px;margin:0 0 14px}
.baris{display:flex;justify-content:space-between;border-top:1px solid #ffedd5;padding:12px 0;font-size:14px;text-align:left}
.baris span:first-child{color:#64748b}
.baris span:last-child{font-weight:700;color:#0f172a;text-align:right;max-width:60%}
</style>
</head>
<body>
<div class="wadah">
<div id="daftar"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const db = supabase.createClient(
"https://jwpzywmbzfsulqwjfvlk.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3cHp5d21iemZzdWxxd2pmdmxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMjg4MjUsImV4cCI6MjEwODkwNDgyNX0.nwkU8wtrnCsJeHPLIhuxZ66Y8lxuenhTyFzUE_7rKVw"
);

async function muat(){
 const {data} = await db.from("siswa").select("*").order("nama");
 const semua = data||[];
 document.getElementById("daftar").innerHTML = semua.map(d=>{
  const isGuru = String(d.role||"").toLowerCase() === "guru";
  
  // INI BEDANYA
  if(isGuru){
    // GURU = Jurusan + Mapel kayak foto Pak Joel
    return `
    <div class="kartu">
      <div class="header-kartu"></div>
      <div class="isi">
        <div class="foto">${d.foto_url?`<img src="${d.foto_url}">`:d.nama.substring(0,2).toUpperCase()}</div>
        <span class="badge">GURU</span>
        <div class="nama">${d.nama}</div>
        <div class="nis">NIP ${d.nis||d.nip||"-"}</div>
        <div class="baris"><span>Jurusan</span><span>${d.jurusan||"Teknik Komputer Jaringan"}</span></div>
        <div class="baris"><span>Mapel</span><span>${d.mapel||"-"}</span></div>
      </div>
    </div>`;
  } else {
    // SISWA = 4 baris
    return `
    <div class="kartu">
      <div class="header-kartu"></div>
      <div class="isi">
        <div class="foto">${d.foto_url?`<img src="${d.foto_url}">`:d.nama.substring(0,2).toUpperCase()}</div>
        <span class="badge">SISWA</span>
        <div class="nama">${d.nama}</div>
        <div class="nis">NIS ${d.nis||"-"}</div>
        <div class="baris"><span>Kelas</span><span>${d.kelas||"-"}</span></div>
        <div class="baris"><span>Jenis kelamin</span><span>${d.jenis_kelamin||"-"}</span></div>
        <div class="baris"><span>Tanggal lahir</span><span>${d.tanggal_lahir||"-"}</span></div>
        <div class="baris"><span>Alamat</span><span>${d.alamat||"-"}</span></div>
      </div>
    </div>`;
  }
 }).join("");
}
muat();
</script>
</body>
</html>
